<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Продолжить просмотр</title>
<script src="theme.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #fff; --text: #202631; --muted: #737d8b; --hover: #f2f5f9;
    --voice-text: #3f608a; --voice-bg: #eaf1fa; --new-text: #267349; --new-bg: #e7f5ec;
    --detail: #505c6d; --warning: #8c681d; --track: #e1e7ef; --accent: #689bd3;
    --border: #dce2ea; --button: #556173; --dialog: #fff; --input: #f7f9fc;
    --danger: #b74242; --primary: #416a9c; --primary-border: #416a9c;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16181c; --text: #eceef2; --muted: #8994a4; --hover: #20242b;
    --voice-text: #b6c8e4; --voice-bg: #283344; --new-text: #9de0b9; --new-bg: #22382d;
    --detail: #c1c7d0; --warning: #bbaa87; --track: #343c48; --accent: #86b8eb;
    --border: #353d49; --button: #bcc5d2; --dialog: #1d222a; --input: #15191f;
    --danger: #e8a1a1; --primary: #304661; --primary-border: #4a6586;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #16181c; --text: #eceef2; --muted: #8994a4; --hover: #20242b;
    --voice-text: #b6c8e4; --voice-bg: #283344; --new-text: #9de0b9; --new-bg: #22382d;
    --detail: #c1c7d0; --warning: #bbaa87; --track: #343c48; --accent: #86b8eb;
    --border: #353d49; --button: #bcc5d2; --dialog: #1d222a; --input: #15191f;
    --danger: #e8a1a1; --primary: #304661; --primary-border: #4a6586;
    }
  }
  * { box-sizing: border-box; }
  body { width: 560px; margin: 0; font: 13px/1.45 system-ui; background: var(--bg); color: var(--text); }
  main { max-height: 430px; overflow-y: auto; padding: 0 10px 10px; }
  .catalog-tools { display:flex; gap:8px; padding:0 20px 12px; }
  .catalog-tools input { flex:1; min-width:0; }
  .catalog-tabs { display:flex; gap:6px; padding:14px 20px 8px; }
  .catalog-tabs [aria-pressed="true"] { background:var(--hover); color:var(--text); border-color:var(--accent); }
  .progress-line { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .progress-line progress { flex:1; min-width:24px; width:0; margin:0; }
  .progress-line .minutes { flex-shrink:0; color:var(--muted); font-size:11px; }
  .card-menu { position:fixed; margin:0; left:auto; bottom:auto; padding:4px; border:1px solid var(--border); border-radius:8px; background:var(--dialog); color:var(--text); min-width:175px; }
  .card-menu:popover-open { display:flex; flex-direction:column; gap:0; }
  .card-menu button { display:flex; align-items:center; gap:8px; width:100%; padding:5px 7px; min-height:26px; border:0; text-align:left; font-size:11px; }
  .card-menu svg { width:14px; height:14px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .menu-group { padding:2px 0; }
  .menu-group + .menu-group { border-top:1px solid var(--border); margin-top:3px; padding-top:5px; }
  .card-menu .menu-trash { color:var(--danger); border-top:1px solid var(--border); border-radius:0 0 5px 5px; margin-top:3px; padding-top:8px; }
  .card-menu [aria-pressed="true"] svg { fill:var(--voice-bg); }
  .catalog-tools[hidden] { display:none; }
  #toggle-search { margin-left:auto; }
  #settings-message { color:var(--muted); font-size:11px; }
  .empty { padding: 28px 10px; color: var(--muted); text-align: center; }
  .entry { position: relative; padding: 2px; margin-bottom: 4px; border-radius: 10px; }
  .entry:hover { background: var(--hover); }
  .watch { display: block; padding: 12px 10px; color: inherit; text-decoration: none; border-radius: 8px; }
  .watch.with-poster { display:grid; grid-template-columns:32px minmax(0, 1fr); column-gap:10px; align-items:start; }
  .poster { width:32px; height:48px; object-fit:cover; border-radius:4px; grid-column:1; grid-row:1 / span 2; }
  .with-poster .title-line, .with-poster .progress-line { grid-column:2; }
  .title-line { display: flex; align-items: baseline; gap: 10px; }
  .view-date { margin-left: auto; flex-shrink: 0; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .heading { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  strong { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .voice, .new { padding: 2px 7px; border-radius: 5px; font-size: 10px; font-weight: 500; }
  .voice { color: var(--voice-text); background: var(--voice-bg); }
  .new { color: var(--new-text); background: var(--new-bg); }
  .entry-source { color:var(--muted); font-size:9px; }
  #trash-list input { width:auto; margin:0 8px 0 0; }
  #trash-list { max-height:300px; overflow-y:auto; }
  .settings-note, #providers p { color:var(--muted); font-size:11px; }
  #providers summary { cursor:pointer; }
  dialog { max-height:90vh; overflow-y:auto; }
  .title-meta { color:var(--muted); font-size:11px; white-space:nowrap; }
  .episode { color: var(--detail); font-size: 12px; white-space: nowrap; }
  .current-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .provider { flex-shrink:0; color:var(--muted); font-size:10px; }
  .title-line { margin-bottom:4px; padding-right:30px; }
  .title-line .heading { flex:1; min-width:0; flex-wrap:wrap; }
  .continuation { margin-left:auto; min-width:0; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:1; padding:2px 6px; border-radius:5px; background:var(--voice-bg); color:var(--voice-text); font-size:11px; font-weight:500; line-height:1.4; }
  .meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; color: var(--muted); font-size: 11px; }
  .release-error { color: var(--warning); margin-top: 5px; font-size: 11px; }
  progress { display: block; width: 100%; height: 3px; margin-top: 10px; border: 0; border-radius: 3px; overflow: hidden; appearance: none; background: var(--track); }
  progress::-webkit-progress-bar { background: var(--track); }
  progress::-webkit-progress-value { background: var(--accent); border-radius: 3px; }
  progress::-moz-progress-bar { background: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  button { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--button); font: inherit; font-size: 11px; cursor: pointer; }
  button:hover { background: var(--hover); color: var(--text); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .edit { position: absolute; top: 13px; right: 8px; border: 0; padding: 3px 7px; font-size: 17px; color: var(--muted); }
  #message { margin: 8px 20px; color: var(--muted); font-size: 11px; }
  #message:empty { display: none; }
  dialog { width: 440px; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--dialog); color: var(--text); }
  dialog::backdrop { background: #0009; }
  h2 { font-size: 16px; margin: 0 0 14px; }
  label { display: block; color: var(--detail); font-size: 12px; margin-bottom: 12px; }
  input, select { width: 100%; margin-top: 5px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--input); color: var(--text); font: inherit; }
  .fields { display: flex; gap: 12px; }
  #episode-fields[hidden] { display: none; }
  .fields label { flex: 1; min-width: 0; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #delete { margin-right: auto; color: var(--danger); }
  .primary { background: var(--primary); border-color: var(--primary-border); color: #fff; }
  #settings { width:380px; padding:0; max-height:min(560px, 92vh); }
  .settings-header { position:sticky; top:0; z-index:1; display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--dialog); border-bottom:1px solid var(--border); }
  .settings-header h2 { margin:0; font-size:14px; }
  .settings-header p { margin:3px 0 0; font-size:11px; color:var(--muted); }
  #close-settings { display:flex; padding:6px; border:0; }
  .settings-body { padding:0 12px 8px; }
  .settings-section { padding:8px 0; border-bottom:1px solid var(--border); }
  .settings-section:last-of-type { border-bottom:0; }
  .settings-section h3 { display:flex; align-items:center; gap:6px; margin:0 0 6px; font-size:11px; font-weight:600; }
  .settings-icon { width:14px; height:14px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .settings-section h3 .settings-icon { color:var(--muted); }
  .section-note { margin:4px 0 6px; color:var(--muted); font-size:11px; line-height:1.5; }
  .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .setting-action { display:flex; align-items:center; gap:6px; width:100%; padding:6px; margin-top:2px; text-align:left; background:var(--input); border-color:var(--border); }
  .action-title { display:block; color:var(--text); font-size:11px; }
  .action-note { display:block; margin-top:3px; color:var(--muted); font-size:10px; line-height:1.4; }
  .setting-action.danger { background:var(--input); border-color:var(--border); }
  .setting-action.danger, .setting-action.danger .action-title { color:var(--danger); }
  .theme-row { display:flex; justify-content:space-between; align-items:center; font-size:12px; }
  .provider-card { padding:8px; border:1px solid var(--border); border-radius:6px; background:var(--input); }
  .provider-card > summary { cursor:pointer; }
  .provider-content { padding-top:10px; }
  .provider-actions { padding-top:8px; border-top:1px solid var(--border); }
  .provider-actions[hidden] { display:none; }
  #settings .setting-action:hover { background:var(--hover); border-color:var(--accent); }
  .provider-name { display:block; font-size:12px; margin-bottom:6px; }
  .provider-features { display:flex; flex-wrap:wrap; gap:4px; list-style:none; margin:0 0 8px; padding:0; }
  .provider-features li { padding:2px 6px; border-radius:5px; background:var(--voice-bg); color:var(--voice-text); font-size:10px; }
  .provider-mirrors { list-style:none; padding:0; margin:8px 0; display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; color:var(--detail); font-size:11px; }
  #providers summary { color:var(--muted); font-size:11px; }
  #settings-message:empty { display:none; }
</style>
<nav class="catalog-tabs" aria-label="Разделы каталога">
<button data-library-view="recent" aria-pressed="true">Продолжить</button>
<button data-library-view="all" aria-pressed="false">Все</button>
<button data-library-view="favorites" aria-pressed="false">Избранное</button>
<button data-library-view="archived" aria-pressed="false">Архив</button>
<button data-library-view="hidden" aria-pressed="false">Скрытые</button>
<button id="toggle-search" aria-label="Поиск" title="Поиск" aria-expanded="false" aria-controls="search-box">⌕</button>
<button id="open-settings" aria-label="Настройки" title="Настройки">⚙</button>
</nav>
<div class="catalog-tools" id="search-box" hidden>
<input id="search" type="search" placeholder="Найти фильм или сериал" aria-label="Поиск по каталогу">

</div>
<main>
<section id="history" aria-label="Локальная история просмотров"></section>

</main>
<p id="message" role="status"></p>
<dialog id="settings" aria-labelledby="settings-title">
<div class="settings-header"><div><h2 id="settings-title">Настройки</h2></div><button id="close-settings" aria-label="Закрыть настройки"><svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12 M6 18 18 6"/></svg></button></div>
<div class="settings-body">
<section class="settings-section" aria-labelledby="appearance-title">
<div class="theme-row"><h3 id="appearance-title">Тема</h3><button id="theme" type="button" title="Тема: автоматически" aria-label="Тема: автоматически">◐ Автоматически</button></div>
</section>
<section class="settings-section" aria-labelledby="backup-title">
<h3 id="backup-title"><svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v14H4Z M3 3h18v4H3Z M9 11h6"/></svg>Резервная копия</h3>

<div class="settings-grid"><button id="export" class="setting-action"><svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5 M4 16v5h16v-5"/></svg><span><span class="action-title">Экспорт</span></span></button><button id="import" class="setting-action"><svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5 M4 16v5h16v-5"/></svg><span><span class="action-title">Восстановить</span><span class="action-note">Заменит текущие данные</span></span></button></div>

</section>

<section class="settings-section" aria-label="Корзина">
<button id="open-trash" class="setting-action"><svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18 M9 6V3h6v3 M5 6l1 15h12l1-15 M10 10v7 M14 10v7"/></svg><span><span class="action-title">Корзина</span></span></button>
</section>
<section class="settings-section" aria-labelledby="providers-title">
<h3 id="providers-title"><svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M3 12h18 M12 3c4 5 4 13 0 18-4-5-4-13 0-18"/></svg>Провайдеры</h3>

<div id="providers"></div>
<section id="hdrezka-actions" class="provider-actions" hidden aria-labelledby="account-title">
<h3 id="account-title"><svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7 M3 4v7h7 M12 7v5l3 2"/></svg>Досмотреть</h3>

<div class="settings-grid"><button id="read-account" title="Прочитать открытую страницу «Досмотреть»" class="setting-action"><svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4Z M8 8h8 M8 12h8 M8 16h5"/></svg><span><span class="action-title">Прочитать</span></span></button><button id="delete-account-history" title="Удалить только импорт. Локальные данные останутся" class="setting-action danger"><svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18 M9 6V3h6v3 M5 6l1 15h12l1-15 M10 10v7 M14 10v7"/></svg><span><span class="action-title">Удалить импорт</span></span></button>
</div>
</section>
</section>
<p id="settings-message" role="status"></p>
</div>
<input id="backup" type="file" accept="application/json,application/gzip,.json,.gz" hidden>
</dialog>
<dialog id="trash" aria-labelledby="trash-title">
<h2 id="trash-title">Корзина</h2>
<div id="trash-list"></div>
<div class="dialog-actions"><button id="close-trash">Закрыть</button><button id="restore-trash">Восстановить выбранные</button></div>
</dialog>
<dialog id="editor">
  <form id="edit-form">
    <h2>Редактировать запись</h2>
    <label>Название<input name="title" required></label>
    <label>Озвучка<input name="translatorName" placeholder="Название озвучки"></label>
    <div class="fields" id="episode-fields">
      <label>Сезон<input name="season" type="number" min="1" required></label>
      <label>Серия<input name="episode" type="number" min="1" required></label>
    </div>
    <label>Позиция просмотра, минут<input name="minutes" type="number" min="0" step="0.1" required></label>
    <label>Статус проекта<select name="projectCompleted"><option value="">Неизвестен</option><option value="true">Завершён</option><option value="false">Выходит</option></select></label>
    <div class="dialog-actions">
      <button id="delete" type="button">В корзину</button>
      <button id="cancel" type="button">Отмена</button>
      <button class="primary" type="submit">Сохранить</button>
    </div>
  </form>
</dialog>
<script type="module" src="popup.js"></script>
</html>
